<!DOCTYPE html>
<html lang="en">
<head>
  <title>Feedback</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>

  <section class="feedback-page">

    <section class="page-header">
      <h1>Send us your feedback</h1>
      <p>Your opinion helps us improve. The HR team reads every message.</p>
    </section>

    <div id="formAlert" class="form-alert hidden"></div>

    <section class="form-box">
      <form id="feedbackForm" novalidate>

        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" readonly>
          <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" readonly>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Choose category</option>
            <option value="Suggestion">Suggestion</option>
            <option value="Complaint">Complaint</option>
            <option value="Praise">Praise</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-message" id="categoryError"></span>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
          <span class="error-message" id="subjectError"></span>
        </div>

        <div class="form-group">
          <p class="rating-title">Rating</p>
          <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5" title="5 stars">&#9733;</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4" title="4 stars">&#9733;</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3" title="3 stars">&#9733;</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2" title="2 stars">&#9733;</label>

            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1" title="1 star">&#9733;</label>
          </div>
          <span class="error-message" id="ratingError"></span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
          <span class="char-counter" id="messageCounter">0 / 500</span>
          <span class="error-message" id="messageError"></span>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn-send">Send feedback</button>
          <button type="reset" class="btn-clear">Clear</button>
        </div>

      </form>
    </section>

  </section>

  <script src="../js/auth.js"></script>
  <script src="../js/feedback (1).js"></script>
</body>
</html>
