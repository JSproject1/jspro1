<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL+NXT | Add Employee</title>

    <link rel="stylesheet" href="../css/addEmployee.css">
</head>

<body>

    <!-- Employees page shown behind the modal -->
    <iframe
        class="background-page"
        src="employees.html"
        aria-hidden="true"
        tabindex="-1">
    </iframe>


    <!-- Overlay -->
    <div class="add-overlay">

        <!-- Modal Card -->
        <div class="add-card">

            <!-- Header -->
            <div class="add-header">

                <div>
                    <span class="add-label">
                        EMPLOYEE MANAGEMENT
                    </span>

                    <h1>
                        Add New Employee
                    </h1>

                    <p>
                        Create a new employee account
                    </p>
                </div>


                <a
                    href="employees.html"
                    class="close-btn"
                    aria-label="Close">
                    ×
                </a>

            </div>


            <!-- Form -->
            <form id="employeeForm">

                <div class="form-grid">

                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter employee name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="employee@email.com"
                            required
                        >

                    </div>


                    <!-- ROLE -->
                    <div class="form-group">

                        <label for="role">
                            Role
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select role...
                            </option>

                            <option value="EMP">
                                Employee
                            </option>

                            <option value="HR">
                                HR
                            </option>

                        </select>

                    </div>


                    <!-- DEPARTMENT -->
                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select id="department" required>

                            <option value="">
                                Select department...
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                        </select>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat password"
                            required
                        >

                    </div>

                </div>


                <!-- MESSAGE -->
                <p id="formMessage"></p>


                <!-- ACTIONS -->
                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="add-btn">
                        Add Employee
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="../js/addemployee.js"></script>

</body>

</html>
