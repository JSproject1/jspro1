<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meeting Room</title>

    <style>

        body {
            margin: 0;
            background-color: #111;
        }

        #meet {
            width: 100%;
            height: 100vh;
        }

    </style>

</head>

<body>

    <div id="meet"></div>


    <script src="https://meet.jit.si/external_api.js"></script>


    <script>

        window.onload = function () {

            // Get room from URL

            let params =
                new URLSearchParams(
                    window.location.search
                );


            let roomName =
                params.get("room");


            if (!roomName) {

                alert("Meeting room not found.");

                return;
            }


            let currentUser =
                JSON.parse(
                    localStorage.getItem("currentUser")
                );


            let options = {

                roomName: roomName,

                width: "100%",

                height: "100%",

                parentNode:
                    document.querySelector("#meet"),

                userInfo: {

                    displayName:
                        currentUser
                            ? currentUser.username
                            : "Guest"

                }

            };


            let api =
                new JitsiMeetExternalAPI(
                    "meet.jit.si",
                    options
                );

        };

    </script>

</body>

</html>
