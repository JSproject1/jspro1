<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL+NXT | Edit Employee</title>

    <link rel="stylesheet" href="../css/edit_employee.css">
</head>

<body>

    <!-- Employees page shown behind the modal -->
    <iframe
        class="background-page"
        src="employees.html"
        aria-hidden="true"
        tabindex="-1">
    </iframe>


    <!-- Blur / dark overlay + centered edit modal -->
    <div class="edit-overlay">

        <div class="edit-card">

            <div class="edit-header">

                <div>
                    <span class="edit-label">EMPLOYEE MANAGEMENT</span>
                    <h1>Edit Employee</h1>
                    <p>Update employee information</p>
                </div>

                <a href="employees.html" class="close-btn" aria-label="Close">
                    ×
                </a>

            </div>


            <form id="editEmployeeForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="editName">Full Name</label>

                        <input
                            type="text"
                            id="editName"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="editEmail">Email</label>

                        <input
                            type="email"
                            id="editEmail"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="editRole">Role</label>

                        <select id="editRole" required>

                            <option value="EMP">
                                Employee
                            </option>

                            <option value="HR">
                                HR
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="editDepartment">
                            Department
                        </label>

                        <select id="editDepartment" required>

                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Design">Design</option>
                            <option value="Sales">Sales</option>

                        </select>
                    </div>

                </div>


                <p id="editMessage"></p>


                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelEditBtn">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="../js/edit_employee.js"></script>

</body>

</html>
