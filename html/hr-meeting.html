    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

          href="../css/hr-meeting.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

</head>

<body>
   <aside id="sideBar" class="side-bar">
    
    
    <!-- LOGO -->
    <div class="side-logo">
        <a href="home2.html">
            <span class="logo-main">Alvora</span>
            <span class="logo-sub">ATELIER</span>
        </a>
    </div>


    <!-- HR LABEL -->
    <div class="nav-section-title">
        HR MANAGEMENT
    </div>


    <!-- NAVIGATION -->
    <nav class="side-navigation">

        <!-- DASHBOARD -->
        <a href="hrDashboard.html" class="nav-item ">
            <i class="bi bi-grid-1x2-fill nav-icon"></i>
            <span>Dashboard</span>
        </a>
        <a href="HRProfile.html" class="nav-item ">
            <i class="bi bi-person-badge nav-icon"></i>
            <span>My Profile</span>
        </a>
        <!-- EMPLOYEES -->
        <a href="employees.html" class="nav-item">
            <i class="bi bi-people-fill nav-icon"></i>
            <span>Employees</span>
        </a>


        <!-- TASKS -->
        <a href="HRTasks.html" class="nav-item">
            <i class="bi bi-check2-square nav-icon"></i>
            <span>Tasks</span>
        </a>


        <!-- LEAVE REQUESTS -->
        <a href="leaveHr.html" class="nav-item">
            <i class="bi bi-calendar2-check nav-icon"></i>
            <span>Leave Requests</span>
        </a>


        <!-- COMPANY POLICIES -->
        <a href="hrPolicies.html" class="nav-item">
            <i class="bi bi-file-earmark-text nav-icon"></i>
            <span>Company Policies</span>
        </a>


        <!-- MEETINGS -->
        <a href="hr-meeting.html" class="nav-item active">
            <i class="bi bi-camera-video nav-icon"></i>
            <span>Meetings</span>
        </a>


        <!-- FEEDBACK -->
        <a href="hr-feedback.html" class="nav-item ">
            <i class="bi bi-chat-left-text nav-icon"></i>
            <span>Feedback</span>
        </a>

    </nav>


    <!-- BOTTOM -->
    <div class="sidebar-footer">

        <div class="sidebar-role">
            <div class="role-icon">
                <i class="bi bi-person-badge"></i>
            </div>

            <div class="role-info">
                <strong>HR Manager</strong>
                <span>Administration</span>
            </div>
        </div>


        <a href="home2.html" class="logout" id="logoutButton">
            <i class="bi bi-box-arrow-left"></i>
            <span>Logout</span>
        </a>

    </div>

</aside>

    <div class="page-container">

        <!-- Header -->

        <div class="page-header">

            <div>
                <h1>Meetings</h1>

                <p>
                    Manage your meetings and invitations
                </p>
            </div>


            <button
                class="new-meeting-btn"
                onclick="showNewMeeting()">

                + New Meeting

            </button>

        </div>


        <!-- Meetings -->

        <div class="meetings-section">

            <div class="section-title">

                <h2>My Meetings</h2>

                <span id="meetingCount">
                    0 Meetings
                </span>

            </div>


            <div id="meetingsContainer"></div>

        </div>


    </div>


    <!-- New Meeting Modal -->

    <div
        id="meetingModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2>Create New Meeting</h2>

                    <p>
                        Send a meeting invitation
                    </p>
                </div>

                <button
                    class="close-btn"
                    onclick="closeNewMeeting()">

                    ×

                </button>

            </div>


            <!-- Title -->

            <label>
                Meeting Title
            </label>

            <input
                type="text"
                id="meetingTitle"
                placeholder="Enter meeting title">


            <!-- Date & Time -->

            <div class="form-row">

                <div>

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="meetingDate">

                </div>


                <div>

                    <label>
                        Time
                    </label>

                    <input
                        type="time"
                        id="meetingTime">

                </div>

            </div>


            <!-- Duration -->

            <label>
                Duration
            </label>

            <select id="meetingDuration">

                <option value="30">
                    30 Minutes
                </option>

                <option value="60">
                    1 Hour
                </option>

                <option value="90">
                    1.5 Hours
                </option>

                <option value="120">
                    2 Hours
                </option>

            </select>


            <!-- Participants -->

            <label>
                Participants
            </label>

            <div
                id="usersContainer"
                class="users-container">

            </div>


            <!-- Buttons -->

            <div class="modal-buttons">

                <button
                    class="cancel-btn"
                    onclick="closeNewMeeting()">

                    Cancel

                </button>


                <button
                    class="create-btn"
                    onclick="createMeeting()">

                    Send Invitation

                </button>

            </div>

        </div>

    </div>


   <script src="../js/hr-meeting.js"></script>
</body>

</html>
